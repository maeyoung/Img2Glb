[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "img2glb"
version = "0.1.0"
description = "이미지 한 장에서 PBR 텍스처가 입혀진 GLB 를 생성하는 CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Korea Electronics Technology Institute (KETI)" }]
keywords = ["3d", "image-to-3d", "glb", "pbr", "trellis"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

# torch 는 플랫폼별 인덱스에서 설치해야 하므로 여기 넣지 않는다.
# scripts/setup_trellis2.sh 참고.
dependencies = [
    "numpy",
    "pillow",
    "trimesh>=4",
    "ninja",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
img2glb = "img2glb.cli:main"

[project.urls]
Homepage = "https://github.com/maeyoung/Img2Glb"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"img2glb.raster" = ["csrc/*.cu"]
